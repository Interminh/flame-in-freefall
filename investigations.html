<!doctype html>
<html lang="en" data-theme="brutal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Investigations | Flame in freefall</title>
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/styles/layout.css" />
    <link rel="stylesheet" href="src/styles/themes.css" />
    <link rel="stylesheet" href="src/styles/investigations.css" />
    <link rel="stylesheet" href="src/styles/brutal.css" />
  </head>
  <body>
    <div id="nav"></div>
    <main class="page">
      <section>
        <p class="eyebrow">NASA PSI database</p>
        <h1>The <span class="hl">investigations</span></h1>
        <p id="lede">Loading the investigations.</p>

        <div class="cat-tools">
          <input type="search" id="q" placeholder="Search name, material, tag" aria-label="Search investigations" />
          <select id="pillar" aria-label="Filter by pillar"></select>
          <select id="hw" aria-label="Filter by hardware"></select>
          <select id="sort" aria-label="Sort">
            <option value="id">PSI number</option>
            <option value="rows">Most data</option>
            <option value="varied">Most variables changed</option>
          </select>
          <span id="count"></span>
        </div>

        <div class="cards" id="rows"></div>
        <p class="cat-note" id="note"></p>
        <p class="cat-credit">Photos: NASA Image and Video Library, credited on each card. Photos show related hardware or sessions and are not data from the investigation. Not every investigation has a photo.</p>
      </section>
    </main>
    <script src="js/nav.js"></script>
    <script defer src="js/chat.js"></script>
    <script src="js/investigations.js"></script>
  </body>
</html>
