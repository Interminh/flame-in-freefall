<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Ignis-0G logo: a round microgravity flame">
  <defs>
    <!-- Outer shell: deep blue at the edge, violet toward the middle -->
    <radialGradient id="shell" cx="50%" cy="62%" r="62%">
      <stop offset="0" stop-color="#9A5CF2"/>
      <stop offset="0.38" stop-color="#5B3DFA"/>
      <stop offset="0.78" stop-color="#2C3BF2"/>
      <stop offset="1" stop-color="#1A2BE0"/>
    </radialGradient>
    <!-- Warm base of the flame, pink to purple -->
    <radialGradient id="core" cx="50%" cy="78%" r="55%">
      <stop offset="0" stop-color="#FFB3DD"/>
      <stop offset="0.55" stop-color="#E26BC9"/>
      <stop offset="1" stop-color="#9A5CF2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="halo" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <circle cx="50" cy="52" r="42" fill="#3A48FF" opacity="0.38" filter="url(#halo)"/>
  <ellipse cx="50" cy="50" rx="39" ry="41" fill="url(#shell)" filter="url(#soft)"/>
  <path d="M22 76C25 55 38 46 50 46s25 9 28 30C68 87 32 87 22 76Z" fill="url(#core)" filter="url(#soft)"/>
  <ellipse cx="38" cy="30" rx="11" ry="7" fill="#fff" opacity="0.2" transform="rotate(-28 38 30)" filter="url(#soft)"/>
</svg>
