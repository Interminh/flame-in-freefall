      <section>
        <p class="eyebrow">NASA Space Apps 2026 · Flame in Freefall</p>
        <h1>The <span class="hl">presentation</span></h1>
        <p>The slides for our entry. Use the arrow keys, the buttons or a swipe to move through them, or open the PDF.</p>

        <div class="deck-links">
          <a class="button-link" href="presentation/IGNIS_0G-presentation.pdf" target="_blank" rel="noopener">Open the PDF</a>
          <a class="button-ghost-dark" href="presentation/IGNIS_0G-presentation.pdf" download>Download the PDF</a>
        </div>

        <div class="deck" data-deck>
          <ol class="deck__slides">
            <li class="deck__slide" data-title="IGNIS_0G: Flame in Freefall">
              <figure>
                <img src="presentation/slide-1.jpg" width="1600" height="900" alt="Title slide: IGNIS_0G, Flame in Freefall, NASA Space Apps 2026, over an image of Earth's curved horizon from space. The four team members are listed at the bottom." />
                <figcaption>1. IGNIS_0G: Flame in Freefall</figcaption>
              </figure>
            </li>
            <li class="deck__slide" data-title="A flame can spread at lower oxygen in orbit">
              <figure>
                <img src="presentation/slide-2.jpg" width="1600" height="900" loading="lazy" alt="A flame can spread at lower oxygen in orbit. Three photos of acrylic rods burning aboard the ISS, from NASA Glenn's BASS-II experiment. In the Earth-gravity test the flame blew off the rod at 16% oxygen. In the ISS experiment the flame kept spreading at 13.6%. The same rod kept burning in orbit at an oxygen level 2.4 percentage points below its Earth blow-off limit." />
                <figcaption>2. A flame can spread at lower oxygen in orbit</figcaption>
              </figure>
            </li>
            <li class="deck__slide" data-title="Our solution">
              <figure>
                <img src="presentation/slide-3.jpg" width="1600" height="900" loading="lazy" alt="Our solution. IGNIS_0G pairs NASA fire experiments with published research so engineers can trace a simulation back to the evidence. 352 PSI publication listings and 64 NASA Technical Reports Server literature records. Side by side: our graph from NASA's FLEX dataset (PSI-69), comparing 197 droplet measurements across two fuels, and Figure 5 from Nayagam et al. (2013)." />
                <figcaption>3. Our solution</figcaption>
              </figure>
            </li>
            <li class="deck__slide" data-title="Where our graphs and published figures come from">
              <figure>
                <img src="presentation/slide-4.jpg" width="1600" height="900" loading="lazy" alt="NASA data and technology. 24 hand-picked PSI investigations, 19 flight and 5 ground. 48 original figures from 23 documents. Tools used: Python, JavaScript with React and Vite, Plotly.js, Groq and gpt-oss-120b, and Vercel." />
                <figcaption>4. Where our graphs and published figures come from</figcaption>
              </figure>
            </li>
            <li class="deck__slide" data-title="Explore a gravity setting and ask about the evidence">
              <figure>
                <img src="presentation/slide-5.jpg" width="1600" height="900" loading="lazy" alt="Working prototype. A screenshot of the flammability map for chosen inputs, next to the Ask Ignis chat answering a question about how temperature affects flames in microgravity." />
                <figcaption>5. Explore a gravity setting and ask about the evidence</figcaption>
              </figure>
            </li>
            <li class="deck__slide" data-title="Three checks against BASS-II flight observations">
              <figure>
                <img src="presentation/slide-6.jpg" width="1600" height="900" loading="lazy" alt="Impact and feasibility. Three checks against BASS-II flight observations: 100% on held-out thin-film tests (11 of 11), 93.8% on the acrylic rod fit (15 of 16), and 94.0% agreement across refits (564 of 600)." />
                <figcaption>6. Three checks against BASS-II flight observations</figcaption>
              </figure>
            </li>
            <li class="deck__slide" data-title="What it will take to test lunar and Martian fire risk">
              <figure>
                <img src="presentation/slide-7.jpg" width="1600" height="900" loading="lazy" alt="Limitations and next steps: what it will take to test lunar and Martian fire risk. Measure burns between microgravity and 1 g, and keep Ask Ignis available during busy demos. A QR code links to the live demo at github.com/Interminh/flame-in-freefall." />
                <figcaption>7. What it will take to test lunar and Martian fire risk</figcaption>
              </figure>
            </li>
          </ol>
        </div>
